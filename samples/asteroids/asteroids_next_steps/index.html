<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Asteroids Next Steps - Babylon.js</title>
  <link rel="stylesheet" href="../../../css/sample.css">
  <style>
    /* .hint has pointer-events: none so the canvas stays interactive; opt the
       "Run tests" link back in so it can be clicked. */
    .hint a {
      pointer-events: auto;
      color: #8ab4ff;
    }

    /* The splash covers the page while the game loads, then fades away. Its dark
       blue matches the edges of the picture, which is shown whole. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050818;
      transition: opacity 0.6s ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash img {
      max-width: 100vw;
      max-height: 100vh;
    }
    #splash p {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 5vh;
      margin: 0;
      padding: 0 24px;
      text-align: center;
      color: #fff;
      font: 18px/1.4 system-ui, sans-serif;
      text-shadow: 0 2px 6px #000;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <script>
    // Asteroids will use Space to fire later on, so move the shared
    // screenshot shortcut to C for this series.
    window.SCREENSHOT_KEY = "KeyC";
  </script>
</head>

<body>
  <a class="back-button" href="../../../index.html#asteroids">&larr; Samples</a>
  <div class="hint">&larr;/&rarr; (A/D) to turn &middot; &uarr; (W) to thrust &middot; Space to fire &middot; H for hyperspace &middot; V for chase camera &middot; P to pause &middot; R to restart &middot; C for a screenshot &middot; <a href="tests.html">Run tests</a></div>
  <div id="splash">
    <img src="../asteroids_splash_small.jpg" alt="Asteroids">
    <p id="splash-status">Loading models&hellip;</p>
  </div>
  <canvas id="renderCanvas"></canvas>
  <script src="../../../js/screenshot.js"></script>
  <script src="js/wrap.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/aim.js"></script>
  <script src="js/models.js"></script>
  <script src="js/ships.js"></script>
  <script src="js/chase.js"></script>
  <script src="js/ship.js"></script>
  <script src="js/bullets.js"></script>
  <script src="js/rocks.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
  <script src="js/waves.js"></script>
  <script src="js/ufo.js"></script>
  <script src="js/explosions.js"></script>
  <script src="js/splash.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
