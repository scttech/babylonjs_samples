<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ghost Hunter Door Scan</title>
  <style>
    body { margin: 0; padding: 12px; background: #05080d; color: #f2f3ee; font: 14px "Share Tech Mono", monospace; }
    h1 { font-size: 18px; margin: 0 0 8px; color: #39ff14; }
    #stage { position: relative; display: inline-block; max-width: 100%; }
    canvas { max-width: 100%; display: block; }
    #overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    pre { white-space: pre-wrap; }
    label { display: block; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>Door scan prototype</h1>
  <p>Pick a photo of a room (or use <code>?image=address</code>): a small model finds the doors and stairs, and each one's foot is turned into a floor point as if the phone were held level at eye height.</p>
  <label>Photo <input id="file" type="file" accept="image/*"></label>
  <label>Field of view top to bottom (degrees) <input id="fov" type="number" value="60" min="30" max="100"></label>
  <label>Phone tilt (degrees, negative looks down) <input id="tilt" type="number" value="-12" min="-60" max="30"></label>
  <div id="stage"><canvas id="picture"></canvas><canvas id="overlay"></canvas></div>
  <pre id="report">Loading the model...</pre>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="js/look.js"></script>
  <script src="js/surface.js"></script>
  <script src="js/doorscan.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const table = { ...SCAN, modelUrl: params.get("model") || SCAN.modelUrl };
    const picture = document.getElementById("picture");
    const overlay = document.getElementById("overlay");
    const report = document.getElementById("report");
    const scanner = new DoorScanner(ort, table);
    const ready = scanner.load().then(() => { report.textContent = "Model ready."; });

    async function run(image) {
      await ready;
      picture.width = overlay.width = image.naturalWidth;
      picture.height = overlay.height = image.naturalHeight;
      const context = picture.getContext("2d");
      context.drawImage(image, 0, 0);
      const pixels = context.getImageData(0, 0, picture.width, picture.height);
      const result = await scanner.scan(pixels.data, picture.width, picture.height);
      const fov = Number(document.getElementById("fov").value);
      const tilt = (Number(document.getElementById("tilt").value) * Math.PI) / 180;
      const view = { position: [0, 1.4, 0], forward: [0, Math.sin(tilt), Math.cos(tilt)], up: [0, Math.cos(tilt), -Math.sin(tilt)] };
      const aspect = picture.width / picture.height;
      const candidates = candidatesFrom(result.blobs, view, fov, aspect, table);
      const draw = overlay.getContext("2d");
      draw.clearRect(0, 0, overlay.width, overlay.height);
      const colors = { door: "255,40,40", stairs: "40,120,255" };
      for (let y = 0; y < result.height; y++) {
        for (let x = 0; x < result.width; x++) {
          const kind = table.kinds[result.labels[y * result.width + x]];
          if (!kind) continue;
          draw.fillStyle = `rgba(${colors[kind.name]},0.35)`;
          draw.fillRect((x / result.width) * overlay.width, (y / result.height) * overlay.height, overlay.width / result.width + 1, overlay.height / result.height + 1);
        }
      }
      const lines = [`scan took ${scanner.lastMilliseconds.toFixed(0)} ms; ${result.blobs.length} blobs, ${candidates.length} candidate spots`];
      draw.lineWidth = Math.max(2, overlay.width / 200);
      draw.font = `${Math.round(overlay.width / 28)}px monospace`;
      for (const blob of result.blobs) {
        const [l, t, r, b] = blob.box;
        const chosen = candidates.find((c) => c.bottom === blob.bottom);
        draw.strokeStyle = chosen ? "#39ff14" : "#888";
        draw.strokeRect(l * overlay.width, t * overlay.height, (r - l) * overlay.width, (b - t) * overlay.height);
        if (chosen) {
          draw.fillStyle = "#39ff14";
          draw.beginPath();
          draw.arc(blob.bottom[0] * overlay.width, blob.bottom[1] * overlay.height, overlay.width / 60, 0, 7);
          draw.fill();
          draw.fillText(`${chosen.distance.toFixed(1)} m`, blob.bottom[0] * overlay.width + 12, blob.bottom[1] * overlay.height - 12);
        }
        lines.push(`${blob.kind}${blob.onFloor ? "" : " (no floor found)"}: ${(blob.area * 100).toFixed(1)}% of the picture, foot at ${blob.bottom.map((n) => n.toFixed(2)).join(", ")}${chosen ? `, spot ${chosen.point.map((n) => n.toFixed(1)).join(", ")} (${chosen.distance.toFixed(1)} m)` : ", not used"}`);
      }
      report.textContent = lines.join("\n");
      window.scanDone = { blobs: result.blobs.length, candidates: candidates.length, milliseconds: scanner.lastMilliseconds };
    }

    let current = null;
    const show = (image) => {
      current = image;
      run(image).catch((error) => { report.textContent = String(error); window.scanDone = { error: String(error) }; });
    };
    function load(source) {
      const image = new Image();
      image.crossOrigin = "anonymous";
      image.onload = () => show(image);
      image.onerror = () => { report.textContent = "That picture would not load."; };
      image.src = source;
    }
    document.getElementById("file").addEventListener("change", (event) => { if (event.target.files[0]) load(URL.createObjectURL(event.target.files[0])); });
    for (const id of ["fov", "tilt"]) document.getElementById(id).addEventListener("change", () => { if (current) show(current); });
    if (params.get("image")) load(params.get("image"));
  </script>
</body>
</html>
