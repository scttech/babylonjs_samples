<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Babylon.js Samples</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16171a;
      --card: #1f2024;
      --border: #2c2d33;
      --text: #f2f2f2;
      --muted: #a0a0a8;
      --accent: #4a90e2;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    a { color: inherit; }
    header {
      padding: 48px 24px 24px;
      text-align: center;
    }
    header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px 48px;
      box-sizing: border-box;
    }

    /* --- Roadmap (home view) --- */
    .roadmap {
      position: relative;
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
    }
    /* The vertical line connecting the stops. */
    .roadmap::before {
      content: "";
      position: absolute;
      left: 19px;
      top: 20px;
      bottom: 20px;
      width: 2px;
      background: var(--border);
    }
    .stop {
      position: relative;
      padding-left: 56px;
      margin-bottom: 24px;
    }
    .stop-marker {
      position: absolute;
      left: 0;
      top: 12px;
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .stop.soon .stop-marker {
      border-color: var(--border);
      color: var(--muted);
    }
    .series-card {
      display: flex;
      align-items: center;
      gap: 24px;
      box-sizing: border-box;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      text-decoration: none;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .series-card:hover, .series-card:focus-visible {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .series-text {
      flex: 1;
      min-width: 0;
    }
    /* A game's logo, for a little flair. It is optional: a series with none is just text. */
    .series-logo {
      flex: none;
      width: 200px;
      height: 135px;
      object-fit: contain;
      border-radius: 8px;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }
    .series-card h2 {
      margin: 0 0 4px;
      font-size: 1.4rem;
    }
    .series-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .series-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .pill {
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
    }
    .pill.accent {
      color: var(--accent);
      border-color: var(--accent);
    }
    .teaches {
      margin: 12px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .teaches strong { color: var(--text); font-weight: 600; }

    /* --- Series (detail) view --- */
    .crumbs {
      margin: 8px 0 16px;
      font-size: 0.9rem;
    }
    .crumbs a {
      color: var(--muted);
      text-decoration: none;
    }
    .crumbs a:hover { color: var(--accent); text-decoration: underline; }
    .series-header {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .series-header .series-logo {
      width: 240px;
      height: 160px;
    }
    .series-header h2 {
      margin: 0 0 4px;
      font-size: 1.8rem;
    }
    .series-header p {
      margin: 0;
      color: var(--muted);
    }
    .steps {
      margin: 24px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 16px;
    }
    .step {
      display: flex;
      gap: 16px;
      box-sizing: border-box;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .step-number {
      flex: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      margin-top: 2px;
    }
    @media (max-width: 600px) {
      .series-card, .series-header {
        flex-direction: column-reverse;
        align-items: stretch;
      }
      .series-logo, .series-header .series-logo {
        width: 100%;
        height: 140px;
      }
    }
    .step.soon { opacity: 0.6; }
    .step.soon .step-number { background: var(--border); color: var(--muted); }
    .step-body { flex: 1; min-width: 0; }
    .step h3 {
      margin: 0 0 4px;
      font-size: 1.1rem;
    }
    .step p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .step-links {
      margin-top: 10px;
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
    }
    .step-links a {
      color: var(--accent);
      text-decoration: none;
    }
    .step-links a:hover { text-decoration: underline; }
    .step-links a.secondary { color: var(--muted); }
    .step-links a.secondary:hover { color: var(--accent); }
    .badge {
      font-size: 0.75rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 8px;
      margin-left: 8px;
      font-weight: 400;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <header>
    <h1>Babylon.js Samples</h1>
    <p>Learn Babylon.js by building games, one small step at a time.</p>
  </header>
  <main id="main"></main>

  <script>
    const REPO = "https://github.com/scttech/babylonjs_samples/blob/main";

    // Add a series here whenever a new game/topic is started. Series are shown
    // in this order on the roadmap, so each one should build on the last.
    // Each step lives at samples/<series.id>/<step.slug>/. A step with no
    // `slug` is shown as "coming soon" (planned, not yet built). Set
    // `tutorial: true` on a step that ships a TUTORIAL.md to link it too, and
    // `dev: true` on a step that has a developer panel (?dev) to link that too.
    const series = [
      {
        id: "introduction",
        title: "Introduction",
        description: "Fundamentals of Babylon.js, built up one feature at a time around a bouncing ball.",
        teaches: "Scenes, animation, sound, unit tests, input, GUI, lighting, particles",
        steps: [
          { slug: "bouncing_circle", title: "Bouncing Circle", description: "A circle bounces around the screen." },
          { slug: "bouncing_ball_sparks", title: "Bouncing Ball with Sparks", description: "A ball bounces around the screen, throwing off sparks on every wall hit." },
          { slug: "bouncing_ball_sparks_sound", title: "Bouncing Ball with Sparks and Sound", description: "A ball bounces around the screen, throwing off sparks and a synthesized thump on every wall hit." },
          { slug: "bouncing_ball_tests", title: "Bouncing Ball with Unit Tests", description: "Refactor code (for Ball and Sparks) into its own classes and verify with QUnit tests." },
          { slug: "bouncing_ball_slingshot", title: "Bouncing Ball Slingshot", description: "Drag the ball back and release to launch it, with a growing color-coded indicator previewing the shot." },
          { slug: "bouncing_ball_hud", title: "Bouncing Ball HUD", description: "A TextBlock counts wall bounces, and a Button resets the ball to the center at rest." },
          { slug: "bouncing_ball_orthographic", title: "Bouncing Ball Orthographic", description: "The ball becomes a real lit mesh viewed through an orthographic camera, bridging from 2D GUI to a 3D world." },
          { slug: "bouncing_ball_particles_friction", title: "Bouncing Ball Particles & Friction", description: "Sparks are real BABYLON.ParticleSystem bursts now, and the ball loses energy on every bounce until it settles at rest." },
        ],
      },
      {
        id: "breakout",
        title: "Breakout",
        description: "The bouncing-ball toy evolves into a full Breakout game.",
        teaches: "Collision response, game state, levels, power-ups, start/pause flow, lit 3D meshes",
        steps: [
          { slug: "breakout_paddle", title: "Breakout Paddle", description: "The bouncing-ball toy becomes a game: a player-controlled paddle deflects the ball, steering it based on where it lands." },
          { slug: "breakout_bricks", title: "Breakout Bricks", description: "A destructible grid of bricks and a score turn the toy into an actual game." },
          { slug: "breakout_lives", title: "Breakout Lives", description: "Missing the ball costs a life; running out freezes the game with a Game Over overlay until Reset." },
          { slug: "breakout_levels", title: "Breakout Levels", description: "Three brick layouts with tougher multi-hit bricks, cleared one after another for an actual win condition." },
          { slug: "breakout_polish", title: "Breakout Polish", description: "A start screen, pause, and wide-paddle/extra-life/multi-ball power-ups." },
          { slug: "breakout_next_steps", title: "Breakout Next Steps", description: "Bricks get real dimension (lit highlight/shadow bevel bands), and the ball now bounces off a fixed-size box with visible walls instead of the browser window's edges." },
        ],
      },
      {
        id: "asteroids",
        logo: "samples/asteroids/asteroids_splash_small.jpg",
        title: "Asteroids",
        description: "A classic Asteroids clone, built up from a single thrusting ship.",
        teaches: "Rotation and inertia, screen wrap, projectiles, enemy AI, procedural shapes",
        steps: [
          { slug: "asteroids_ship", title: "Asteroids Ship", description: "A vector-style ship you rotate and thrust, with inertia and screen wrap." },
          { slug: "asteroids_bullets", tutorial: true, title: "Asteroids Bullets", description: "Hold Space to fire bullets that inherit the ship's momentum, with a cooldown, a four-bullet cap, and screen wrap." },
          { slug: "asteroids_rocks", tutorial: true, title: "Asteroids Rocks", description: "Shoot drifting rocks that split into smaller, faster, higher-scoring ones, with circle collisions and a synthesized explosion." },
          { slug: "asteroids_lives", tutorial: true, title: "Asteroids Lives", description: "Rocks now hurt: three lives, a blinking protected respawn, and a Game Over screen." },
          { slug: "asteroids_waves", tutorial: true, title: "Asteroids Waves", description: "Escalating waves: more and faster rocks each time, a WAVE announcement, and rocks that each have their own shape." },
          { slug: "asteroids_ufo", tutorial: true, title: "Asteroids UFO", description: "An enemy saucer that crosses the screen and shoots back: big and sloppy, or small and able to lead its shots." },
          { slug: "asteroids_polish", tutorial: true, title: "Asteroids Polish", description: "A title screen, pause, particle explosions, a risky hyperspace jump, and a thrust rumble." },
          { slug: "asteroids_next_steps", tutorial: true, title: "Asteroids Next Steps", description: "Lit 3D rocks, a choice of 3D ships, flying-saucer models, and a chase camera." },
        ],
      },
      {
        id: "parkour_runner",
        logo: "samples/parkour_runner/assets/images/parkour_runner_logo_small.png",
        title: "Parkour Runner",
        description: "An endless city-street parkour runner in real 3D: a third-person camera, animated characters, and models from the first step.",
        teaches: "Perspective cameras, fog and lights, loading and instancing models, skeletal animation, endless worlds, spawning and pooling, 3D collisions",
        steps: [
          { slug: "parkour_runner_world", tutorial: true, title: "Parkour Runner World", description: "A city street built from real 3D pieces, with fog and lights, and a camera you can walk down it." },
          { slug: "parkour_runner_runner", tutorial: true, title: "Parkour Runner Runner", description: "An animated runner who sprints down the street, eases between three lanes, and is followed by a camera." },
          { slug: "parkour_runner_street", tutorial: true, title: "Parkour Runner Street", description: "An endless street: pieces are made ahead of the runner and recycled from behind, so it never ends and never grows." },
          { slug: "parkour_runner_moves", tutorial: true, title: "Parkour Runner Moves", description: "Jump, slide, and dive into a roll: a small state machine for the runner, with clips played to fit each move." },
          { slug: "parkour_runner_obstacles", tutorial: true, title: "Parkour Runner Obstacles", description: "Barriers to jump or vault, bars to slide under, and containers to dodge: collisions that use the runner's height, and a crash when you get it wrong." },
          { slug: "parkour_runner_score", tutorial: true, title: "Parkour Runner Score", description: "Coins to collect, a distance counter, a speed that rises as you run, and a combo for clean moves, all on a Babylon.js GUI display." },
          { slug: "parkour_runner_screens", tutorial: true, title: "Parkour Runner Screens", description: "A title screen with your name and a choice of runner color, a pause, and a game over screen with a local leaderboard, in the graffiti font of the logo." },
          { slug: "parkour_runner_effects", tutorial: true, title: "Parkour Runner Effects", description: "Sounds made with code, gold sparkles for coins, dust and a camera shake for a crash, and a Sick Combo banner." },
          { slug: "parkour_runner_touch", tutorial: true, title: "Parkour Runner Touch", description: "Swipe and tap controls, a pause button, a camera that fits a phone held upright, and a layout for small screens." },
        ],
      },
      {
        id: "rolling_rampage",
        logo: "samples/rolling_rampage/assets/images/rolling_rampage_logo_small.webp",
        title: "Rolling Rampage",
        description: "An isometric marble game with real physics, for the desktop and the phone: roll a steel marble down ramps, past hazards and enemies, against the clock, and tilt your phone to steer.",
        teaches: "The Havok physics engine, rigid bodies, friction and bounce, an isometric orthographic camera, levels from data, trigger zones, moving platforms, device tilt, and testing physics without a screen",
        steps: [
          { slug: "rolling_rampage_world", tutorial: true, title: "Rolling Rampage World", description: "A steel marble rolls down a course of ramps under Havok physics, seen through an isometric camera, on a page that fits a phone." },
          { slug: "rolling_rampage_marble", tutorial: true, title: "Rolling Rampage Marble", description: "Steering with forces: the keyboard and a floating touch stick, camera-relative, with the push fading near top speed." },
          { slug: "rolling_rampage_tilt", tutorial: true, title: "Rolling Rampage Tilt", description: "Steering by tipping the phone like a tray: the motion sensor, permission, calibration, a dead zone and easing, tested with a fake sensor." },
          { slug: "rolling_rampage_levels", tutorial: true, title: "Rolling Rampage Levels", description: "Courses drawn as a grid of heights: ramps and holes become a mesh the marble rolls on, with a fall limit and a next-level button." },
          { slug: "rolling_rampage_clock", tutorial: true, title: "Rolling Rampage Clock", description: "A countdown, a goal and checkpoints: a state machine for a run, and Havok trigger zones the marble rolls through." },
          { slug: "rolling_rampage_hazards", tutorial: true, title: "Rolling Rampage Hazards", description: "A moving platform, a piston and slime: motion as a function of time, animated physics bodies, and carrying a rolling marble." },
          { slug: "rolling_rampage_enemies", tutorial: true, title: "Rolling Rampage Enemies", description: "Marbles that chase you: a class reused with options, a chase as a state machine, collision events, and a hit with a cooldown." },
          { slug: "rolling_rampage_screens", tutorial: true, title: "Rolling Rampage Screens", description: "A title, a pause, a score and a leaderboard, sound made in code, and a shiny chrome pinball marble." },
          { slug: "rolling_rampage_polish", tutorial: true, dev: true, title: "Rolling Rampage Polish", description: "Seven more levels (ten in all), sparks, a firework and a trail, a camera shake, and a ?dev panel of sliders to tune the game while you play." },
          { slug: "rolling_rampage_editor", tutorial: true, dev: true, title: "Rolling Rampage Editor", description: "A level editor inside the game: draw the floor, ramp it, place things, get told what is wrong as you draw, then test, save, play and share your own levels." },
        ],
      },
      {
        id: "rooftop_parkour",
        logo: "samples/rooftop_parkour/assets/images/parkour_runner_freerun_logo_small.webp",
        title: "Parkour Runner Free Run",
        description: "A free-roaming parkour game in a city district, in real 3D: run the streets, climb the buildings by their ledges, and cross the rooftops, with a developer mode to watch and tune every move.",
        teaches: "Loading screens with real progress, worlds as data, instancing, the sun and shadows, third-person cameras and the pointer lock, character controllers, animation blending, ledge grabbing, and checking that a jump can be made",
        steps: [
          { slug: "rooftop_parkour_world", tutorial: true, dev: true, title: "Rooftop Parkour World", description: "A district of real buildings in the sun at any time of day, a runner and a third-person camera, a loading screen with a progress bar, and a developer panel." },
          { slug: "rooftop_parkour_run", tutorial: true, dev: true, title: "Rooftop Parkour Run", description: "A body that falls, steps and lands: a character controller you write yourself, standing on rooftops, with a landing animation and gravity and step height to tune." },
          { slug: "rooftop_parkour_jump", tutorial: true, dev: true, title: "Rooftop Parkour Jump", description: "Jumps that feel fair: a tap is a hop, a moment of grace after running off an edge, a press just before landing that isn't lost, and a roll after a fall." },
          { slug: "rooftop_parkour_ledges", tutorial: true, dev: true, title: "Rooftop Parkour Ledges", description: "Jump at a wall, catch the ledge, hang, shimmy along it and climb onto the roof: ledges found from the boxes of the world, and a grab that is decided by arithmetic and tested." },
          { slug: "rooftop_parkour_moves", tutorial: true, dev: true, title: "Rooftop Parkour Moves", description: "Vault a low wall at a run, mantle a crate, kick off a wall in the air, and get a little help with a grab that is nearly right: moves decided by arithmetic, tried in a training yard." },
          { slug: "rooftop_parkour_rooftops", tutorial: true, dev: true, title: "Rooftop Parkour Rooftops", description: "Climb a fire escape from the street to a roof and jump the gaps between the roofs: walls measured from the models, climbs and jumps proved by a bot that plays the game." },
          { slug: "rooftop_parkour_goals", tutorial: true, dev: true, title: "Rooftop Parkour Goals", description: "Tokens to collect, a flow score that rewards chained moves, and a time trial round the block, with a bot that proves every goal can be reached." },
          { title: "Rooftop Parkour Screens", description: "A title with a choice of runner, a pause, best times, sounds and effects." },
          { title: "Rooftop Parkour Touch", description: "A phone version: a thumb stick, buttons and a drag-to-look camera." },
          { title: "Rooftop Parkour Generator", description: "A city made from a seed that follows the same rules for what can be jumped." },
        ],
      },
      {
        id: "ghost_hunter",
        logo: "samples/ghost_hunter/assets/images/ghost_hunter_logo_small.webp",
        title: "Ghost Hunter",
        description: "An augmented reality ghost hunt for your phone: the camera shows your room, and the dead turn up in it. Creepy on purpose, so play it where you feel safe.",
        teaches: "The camera and motion sensors of a phone, WebXR augmented reality with a fallback, transparent canvases, shaders for ghosts, spawning and scares, audio in 3D, and testing a game that needs a phone",
        steps: [
          { slug: "ghost_hunter_room", tutorial: true, dev: true, title: "Ghost Hunter Room", description: "The camera behind a see-through 3D scene, looking around with the phone's motion sensors (or by dragging), and a start screen with a content warning." },
          { slug: "ghost_hunter_ar", tutorial: true, dev: true, title: "Ghost Hunter AR", description: "Real augmented reality on an Android phone (the phone finds the floor), a guessed floor everywhere else, a target and marks on it, and a switch that hides everything that stands in for a model." },
          { slug: "ghost_hunter_apparitions", tutorial: true, dev: true, title: "Ghost Hunter Apparitions", description: "A ghost made entirely in code: a lathe body, a see-through glowing shader, burning eyes, a trail of wisps and mist on the floor, flickering and turning to watch you." },
          { slug: "ghost_hunter_creatures", tutorial: true, dev: true, title: "Ghost Hunter Creatures", description: "A spider, a ghoul and a skeleton that lurk, stalk and lunge, made of sticks and balls from a pose list (placeholders you can hide), with a slot ready for real models." },
          { slug: "ghost_hunter_hunt", tutorial: true, dev: true, title: "Ghost Hunter The Hunt", description: "A director that paces the scares: dread that builds, a strike that is never on the beat, creatures sent from behind you and the edge of the view (never in it), a rest, and a debug map." },
          { slug: "ghost_hunter_scares", tutorial: true, dev: true, title: "Ghost Hunter Jump Scares", description: "Build-up, silence and the strike: the room goes quiet as a creature comes near, then sound made in code, a flash, a shake and a buzz, with Gentle, Creepy and Terrifying levels you choose." },
          { slug: "ghost_hunter_models", tutorial: true, dev: true, title: "Ghost Hunter Models", description: "The first real art: models made phone-sized and moved by code (a rock, a lean, a topple), a doll, a floater and a horde, ghosts that are models, and tests that load the real files." },
          { slug: "ghost_hunter_music", tutorial: true, dev: true, title: "Ghost Hunter Music", description: "A score that listens: two recorded ambient tracks mixed by the dread, a bed, then tension, then both out for the silence before a strike, streamed and eased." },
          { slug: "ghost_hunter_tools", tutorial: true, dev: true, title: "Ghost Hunter Tools", description: "A flashlight that shows ghosts and stuns what hates it, a capture beam that holds and captures, a battery and a heat, and a weakness for every kind of creature." },
          { title: "Ghost Hunter Detectors", description: "An EMF meter, a radar, a spirit box and thermal vision." },
          { title: "Ghost Hunter Rounds", description: "Rounds, health and sanity, a ghost journal and saved scores." },
          { title: "Ghost Hunter Polish", description: "Calm mode, install as an app, and testing on real phones." },
        ],
      },
    ];

    const main = document.getElementById("main");

    const builtCount = (s) => s.steps.filter((step) => step.slug).length;

    // A series' logo as an image, if it has one. The picture is decoration (the title is
    // right beside it), so it has no alt text, and it loads only when it is about to be seen.
    const logoImage = (s) => (s.logo ? `<img class="series-logo" src="${s.logo}" alt="" loading="lazy">` : "");

    // Home view: the series laid out as a roadmap, in the order they should be learned.
    const renderRoadmap = () => {
      document.title = "Babylon.js Samples";
      const list = document.createElement("ol");
      list.className = "roadmap";
      series.forEach((s, i) => {
        const built = builtCount(s);
        const total = s.steps.length;
        const complete = built === total;
        const item = document.createElement("li");
        item.className = "stop";
        item.innerHTML = `
          <div class="stop-marker" aria-hidden="true">${i + 1}</div>
          <a class="series-card" href="#${s.id}">
            <div class="series-text">
              <h2>${s.title}</h2>
              <p>${s.description}</p>
              <div class="series-meta">
                <span class="pill ${complete ? "accent" : ""}">${built} of ${total} tutorials${complete ? "" : " ready"}</span>
                ${i === 0 ? '<span class="pill">Start here</span>' : ""}
              </div>
              <p class="teaches"><strong>You'll learn:</strong> ${s.teaches}</p>
            </div>
            ${logoImage(s)}
          </a>
        `;
        list.appendChild(item);
      });
      main.replaceChildren(list);
    };

    // Series view: that game's tutorials, in order.
    const renderSeries = (s) => {
      document.title = `${s.title} - Babylon.js Samples`;
      const view = document.createElement("div");
      view.innerHTML = `
        <nav class="crumbs"><a href="#">&larr; All samples</a></nav>
        <div class="series-header">
          <div class="series-text">
            <h2>${s.title}</h2>
            <p>${s.description} Best followed in order &mdash; each tutorial builds on the one before it.</p>
          </div>
          ${logoImage(s)}
        </div>
      `;
      const steps = document.createElement("ol");
      steps.className = "steps";
      s.steps.forEach((step, i) => {
        const item = document.createElement("li");
        item.className = "step" + (step.slug ? "" : " soon");
        const base = `samples/${s.id}/${step.slug}`;
        item.innerHTML = `
          <div class="step-number">${i + 1}</div>
          <div class="step-body">
            <h3>${step.title}${step.slug ? "" : '<span class="badge">Coming soon</span>'}</h3>
            <p>${step.description}</p>
            ${step.slug ? `
              <div class="step-links">
                <a href="${base}/index.html">Run the sample</a>
                ${step.dev ? `<a href="${base}/index.html?dev">Run dev mode</a>` : ""}
                <a class="secondary" href="${REPO}/${base}/README.md">README</a>
                ${step.tutorial ? `<a class="secondary" href="${REPO}/${base}/TUTORIAL.md">Tutorial</a>` : ""}
              </div>` : ""}
          </div>
        `;
        steps.appendChild(item);
      });
      view.appendChild(steps);
      main.replaceChildren(view);
    };

    // Tiny hash router: "#" is the roadmap, "#<series id>" is that series.
    const render = () => {
      const id = decodeURIComponent(location.hash.slice(1));
      const current = series.find((s) => s.id === id);
      if (current) renderSeries(current);
      else renderRoadmap();
      window.scrollTo(0, 0);
    };
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
